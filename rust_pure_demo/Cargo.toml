[package]
name = "rust_pure_demo"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.21"
hex = "0.4"
eframe = { version = "0.28", default-features = false, features = ["glow"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
